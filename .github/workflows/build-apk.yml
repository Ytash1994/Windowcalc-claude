name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare web bundle
        run: |
          rm -rf www
          mkdir -p www
          if [ -f "package.json" ] && [ -d "src" ]; then
            npm install --legacy-peer-deps
            npm run build
            cp -r dist/* www/
            rm -f www/window-calc.html www/measure-calc.html
          elif [ -f "measure-calc.html" ]; then
            cp measure-calc.html www/index.html
          elif [ -f "حاسبة_القياسات.html" ]; then
            cp "حاسبة_القياسات.html" www/index.html
          elif [ -f "window-calc.html" ]; then
            cp window-calc.html www/index.html
          elif [ -f "حاسبة_الشبابيك.html" ]; then
            cp "حاسبة_الشبابيك.html" www/index.html
          elif [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            FIRST_HTML=$(ls -1 *.html 2>/dev/null | head -n 1 || true)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            else
              echo "Error: Upload either the full project (package.json + src/) or window-calc.html"
              exit 1
            fi
          fi

      - name: Configure Capacitor & Android
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.measurecalc.app",
            "appName": "حاسبة القياسات",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/measurecalc/app
          cat > android/app/src/main/java/com/measurecalc/app/SaveFilePlugin.java <<'JAVA'
          package com.measurecalc.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SaveFile")
          public class SaveFilePlugin extends Plugin {
              private static String sanitizeName(String raw) {
                  if (raw == null || raw.trim().isEmpty()) {
                      return "measure_calc_export";
                  }
                  return raw.replaceAll("[\\\\/:*?\"<>|\\u0000-\\u001f]+", "_").trim();
              }

              @PluginMethod
              public void save(PluginCall call) {
                  String filename = sanitizeName(call.getString("filename", "export.bin"));
                  String mime = call.getString("mime", "application/octet-stream");
                  String data = call.getString("data");
                  if (data == null || data.isEmpty()) {
                      call.reject("Empty file data");
                      return;
                  }
                  try {
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      Uri resultUri = null;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          try {
                              ContentResolver resolver = getContext().getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, mime);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/حاسبة الشبابيك");
                              values.put(MediaStore.Downloads.IS_PENDING, 1);
                              Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os == null) throw new Exception("Cannot open output stream");
                                      os.write(bytes);
                                      os.flush();
                                  }
                                  ContentValues done = new ContentValues();
                                  done.put(MediaStore.Downloads.IS_PENDING, 0);
                                  resolver.update(uri, done, null, null);
                                  resultUri = uri;
                              }
                          } catch (Exception ignored) {
                              resultUri = null;
                          }
                      }
                      if (resultUri == null) {
                          File pubDownloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          File targetDir = new File(pubDownloads, "حاسبة الشبابيك");
                          if (!targetDir.exists() && !targetDir.mkdirs()) {
                              targetDir = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                              if (targetDir != null && !targetDir.exists()) targetDir.mkdirs();
                          }
                          File outFile = new File(targetDir, filename);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(bytes);
                              fos.flush();
                          }
                          resultUri = FileProvider.getUriForFile(
                              getContext(),
                              getContext().getPackageName() + ".fileprovider",
                              outFile
                          );
                      }
                      JSObject ret = new JSObject();
                      ret.put("uri", resultUri.toString());
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Save failed: " + e.getMessage(), e);
                  }
              }

              @PluginMethod
              public void open(PluginCall call) {
                  String uriStr = call.getString("uri");
                  String mime = call.getString("mime", "*/*");
                  if (uriStr == null || uriStr.isEmpty()) {
                      call.reject("Missing URI");
                      return;
                  }
                  try {
                      Uri uri = Uri.parse(uriStr);
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, mime);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getActivity().startActivity(Intent.createChooser(intent, "فتح الملف"));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Open failed: " + e.getMessage(), e);
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/measurecalc/app/MainActivity.java <<'JAVA'
          package com.measurecalc.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("WRITE_EXTERNAL_STORAGE")) {
              xml = xml.replace(
                "<uses-permission android:name=\"android.permission.INTERNET\" />",
                "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />"
              );
              fs.writeFileSync(p, xml);
            }
          '
          npx cap sync android
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          ICON_ONLY=""
          ICON_FG=""
          ICON_BG=""
          for f in public/assets/aistudio/icon-only_*.png icon-only.png app-icon.png public/app-icon.png; do
            [ -f "$f" ] && ICON_ONLY="$f" && break
          done
          for f in public/assets/aistudio/icon-foreground_*.png icon-foreground.png; do
            [ -f "$f" ] && ICON_FG="$f" && break
          done
          for f in public/assets/aistudio/icon-background_*.png icon-background.png; do
            [ -f "$f" ] && ICON_BG="$f" && break
          done
          if [ -z "$ICON_ONLY" ] && [ -f "www/index.html" ]; then
            node -e '
              const fs = require("fs");
              const html = fs.readFileSync("www/index.html", "utf8");
              const m = html.match(/data:image\/png;base64,([A-Za-z0-9+/=]{2000,})/);
              if (m) fs.writeFileSync("/tmp/extracted-icon.png", Buffer.from(m[1], "base64"));
            '
            [ -f "/tmp/extracted-icon.png" ] && ICON_ONLY="/tmp/extracted-icon.png"
          fi
          if [ -n "$ICON_ONLY" ]; then
            RES_DIR="android/app/src/main/res"
            write_density() {
              D="$1"; SZ="$2"; ASZ="$3"
              DIR="$RES_DIR/mipmap-$D"
              mkdir -p "$DIR"
              convert "$ICON_ONLY" -resize "${SZ}x${SZ}" "$DIR/ic_launcher.png"
              convert "$ICON_ONLY" -resize "${SZ}x${SZ}" -alpha set \
                \( -size "${SZ}x${SZ}" xc:none -fill white -draw "circle $((SZ/2)),$((SZ/2)) $((SZ/2)),0" \) \
                -compose CopyOpacity -composite "$DIR/ic_launcher_round.png"
              if [ -n "$ICON_FG" ] && [ -n "$ICON_BG" ]; then
                convert "$ICON_FG" -resize "${ASZ}x${ASZ}" "$DIR/ic_launcher_foreground.png"
                convert "$ICON_BG" -resize "${ASZ}x${ASZ}" "$DIR/ic_launcher_background.png"
              else
                INSET=$((ASZ * 66 / 100))
                convert -size "${ASZ}x${ASZ}" xc:none \( "$ICON_ONLY" -resize "${INSET}x${INSET}" \) -gravity center -composite "$DIR/ic_launcher_foreground.png"
                convert "$ICON_ONLY" -resize 1x1\! -resize "${ASZ}x${ASZ}" "$DIR/ic_launcher_background.png"
              fi
            }
            write_density mdpi 48 108
            write_density hdpi 72 162
            write_density xhdpi 96 216
            write_density xxhdpi 144 324
            write_density xxxhdpi 192 432
            mkdir -p "$RES_DIR/mipmap-anydpi-v26"
            sed 's/^          //' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
            cp "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          fi
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk measure-calc.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: measure-calc-apk
          path: measure-calc.apk

      - name: Publish Release with direct APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: measure-calc-apk
          name: "حاسبة القياسات - APK"
          files: measure-calc.apk
